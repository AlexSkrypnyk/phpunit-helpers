name: Test PHP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:
    inputs:
      enable_terminal:
        type: boolean
        description: 'Enable terminal session.'
        required: false
        default: false

permissions:
  contents: read

jobs:
  test-php:
    name: PHP ${{ matrix.php-versions }}, Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write # Post the coverage summary as a PR comment.

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.3', '8.4', '8.5']
        symfony: ['6.4 lowest', '6.4 highest', '7.2 lowest', '7 highest', '8.0 lowest', '8 highest']
        exclude:
          # Symfony 8 requires PHP 8.4.
          - php-versions: '8.3'
            symfony: '8.0 lowest'
          - php-versions: '8.3'
            symfony: '8 highest'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ matrix.symfony }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: pcov
          ini-values: pcov.directory=.

      # An empty constraint resolves every dependency at its floor, which is
      # how the lowest end of the supported PHPUnit range gets covered.
      - name: Resolve the Symfony constraint for this leg
        run: |
          case "${{ matrix.symfony }}" in
            "6.4 lowest")  constraint=""      expected="v6.4.0" ;;
            "6.4 highest") constraint="^6.4"  expected="v6.4." ;;
            "7.2 lowest")  constraint="7.2.0" expected="v7.2.0" ;;
            "7 highest")   constraint="^7.2"  expected="v7." ;;
            "8.0 lowest")  constraint="8.0.0" expected="v8.0.0" ;;
            "8 highest")   constraint="^8.0"  expected="v8." ;;
            *) echo "Unknown Symfony leg '${{ matrix.symfony }}'." ; exit 1 ;;
          esac
          echo "SYMFONY_CONSTRAINT=${constraint}" >> "$GITHUB_ENV"
          echo "SYMFONY_EXPECTED=${expected}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          if [[ -z "${SYMFONY_CONSTRAINT}" ]]; then
            composer update --prefer-lowest --prefer-stable ${{ matrix.php-versions == '8.5' && '--ignore-platform-reqs' || '' }}
          else
            composer update --with "symfony/console:${SYMFONY_CONSTRAINT}" --with "symfony/filesystem:${SYMFONY_CONSTRAINT}" --with "symfony/finder:${SYMFONY_CONSTRAINT}" --with "symfony/process:${SYMFONY_CONSTRAINT}" ${{ matrix.php-versions == '8.5' && '--ignore-platform-reqs' || '' }}
          fi

      - name: Validate composer.json
        run: |
          composer --verbose validate
          composer normalize --dry-run

      # A leg that resolves a version other than the one it is named after
      # would repeat a combination another leg already covers.
      - name: Check the installed Symfony version
        run: |
          for package in symfony/console symfony/filesystem symfony/finder symfony/process; do
            version=$(composer show "${package}" --format=json | jq -r '.versions[0]')
            echo "${package} ${version}"
            if [[ "${version}" != "${SYMFONY_EXPECTED}"* ]]; then
              echo "${package} ${version} does not match ${SYMFONY_EXPECTED} for the '${{ matrix.symfony }}' leg."
              exit 1
            fi
          done

      - name: Check coding standards
        if: matrix.php-versions == '8.4' && matrix.symfony == '8 highest'
        run: composer lint
        continue-on-error: ${{ vars.CI_LINT_IGNORE_FAILURE == '1' }}

      - name: Run tests
        run: composer test-coverage
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

      - name: Check code coverage threshold
        if: matrix.php-versions == '8.4' && matrix.symfony == '8 highest'
        run: |
          RATE=$(grep -o 'line-rate="[0-9.]*"' .logs/cobertura.xml | head -1 | tr -cd '0-9.')
          PERCENT=$(awk "BEGIN {printf \"%.2f\", $RATE*100}")
          echo "Coverage: $PERCENT% (threshold: $CI_CODE_COVERAGE_THRESHOLD%)"
          if [[ ${PERCENT//./} -lt $((CI_CODE_COVERAGE_THRESHOLD*100)) ]]; then
            echo "FAIL: coverage too low"
            exit 1
          fi
          { echo "COVERAGE_CONTENT<<EOF"; sed '/./,$!d' .logs/coverage.txt; echo "EOF"; } >> "$GITHUB_ENV"
        env:
          CI_CODE_COVERAGE_THRESHOLD: ${{ vars.CI_CODE_COVERAGE_THRESHOLD || '80' }}

      - name: Post coverage summary as PR comment
        if: matrix.php-versions == '8.4' && matrix.symfony == '8 highest' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3
        with:
          message: |
            ```
            ${{ env.COVERAGE_CONTENT }}
            ```
          # Post a new comment every time to keep the coverage history.
          hide_and_recreate: true

      - name: Upload coverage report as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{github.job}}-code-coverage-report-${{ matrix.php-versions }}-${{ matrix.symfony }}
          path: .logs
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: matrix.php-versions == '8.4' && matrix.symfony == '8 highest' && env.CODECOV_TOKEN != ''
        with:
          files: .logs/junit.xml
          report_type: test_results
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: matrix.php-versions == '8.4' && matrix.symfony == '8 highest' && env.CODECOV_TOKEN != ''
        with:
          files: .logs/cobertura.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Setup tmate session
        if: ${{ !cancelled() && github.event.inputs.enable_terminal }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        timeout-minutes: 30
